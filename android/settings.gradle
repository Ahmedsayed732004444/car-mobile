pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Check for the latest stable versions from official sources
    id "dev.flutter.flutter-plugin-loader" version "1.0.0" // Update if a newer version is available
    id "com.android.application" version "8.13.0" apply false // Example: Updated AGP
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "com.google.gms.google-services" version "4.4.4" apply false// Example: Updated Kotlin
}

include ":app"
